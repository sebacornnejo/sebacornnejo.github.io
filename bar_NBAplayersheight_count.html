        }

            vertical-align: top;
            display: inline-block;
            width: 100%;
            background-color: #a8ff00;
            animation: loader-inner 2s infinite ease-in;
        }

        @keyframes loader {
            0% {

            25% {

            50% {
                transform: rotate(180deg);
            }

            75% {
                transform: rotate(360deg);
            }

            100% {
                transform: rotate(360deg);
            }

        @keyframes loader-inner {
            0% {
                height: 0%;
            }

            25% {
                height: 0%;
            }

            50% {
                height: 100%;
            }

            75% {
                height: 100%;
            }

            100% {
                height: 0%;
            }
        }

        #bee {
