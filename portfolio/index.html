    <script>
(() => {
  const character = document.getElementById("bee");
  if (!character) return;

  character.style.position = "fixed";
  character.style.left = "0";
  character.style.top = "0";
  character.style.visibility = "hidden";
  if (!matchMedia("(hover: hover) and (pointer: fine)").matches) return;

  character.style.translate = "0px 0px";
  character.style.transition = "none";
  character.style.willChange = "translate";
  let previousX;

  document.addEventListener("pointermove", (event) => {
    if (event.pointerType !== "mouse") return;
    if (previousX === undefined) {
      character.style.visibility = "visible";
      requestAnimationFrame(() => requestAnimationFrame(() => {
        character.style.transition = "translate 320ms cubic-bezier(.18, .72, .25, 1)";
      }));
    } else if (event.clientX !== previousX) {
      character.style.transform = event.clientX > previousX ? "scaleX(1)" : "scaleX(-1)";
    }
    previousX = event.clientX;
    character.style.translate = `${event.clientX}px ${event.clientY}px`;
  }, { passive: true });
})();
    </script>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
const tl = gsap.timeline({
            paused: true
        });
        let path = document.querySelector("path");
        let spanBefore = CSSRulePlugin.getRule("#hamburger .line-2");

        gsap.set(spanBefore, { background: "#000" });
        gsap.set(".menu", { visibility: "hidden" });
        gsap.set(".overlay", { opacity: 0, display: "none" });

        function revealMenu() {
            revealMenuItems();

            const hamburger = document.getElementById("hamburger");
            const toggleBtn = document.getElementById("toggle-btn");
            const overlay = document.querySelector(".overlay");


            
            toggleBtn.onkeydown = (event) => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    toggleBtn.click();
                }
            };
            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape" && hamburger.classList.contains("active")) {
                    toggleBtn.click();
                    toggleBtn.focus();
                }
            });
            toggleBtn.onclick = (e) => {
                toggleBtn.setAttribute("aria-expanded", String(!hamburger.classList.contains("active")));

                hamburger.classList.toggle("active");
                tl.reversed(!tl.reversed());
            };
        }
        revealMenu();

        function revealMenuItems() {
            const start = "M0 502S175 272 500 272s500 230 500 230V0H0Z";
            const end = "M0, 1005S175, 995, 500, 995s500, 5, 500, 5V0H0Z";

            const power2 = "power2.inout";
            const power4 = "power4.inout";

            tl.to("#hamburger", 0.7, {
                marginTop: "-5px",
                x: -40,
                y: 40,
                ease: power4
            });
            tl.to(
                "#hamburger .line",
                0.7,
                {
                    background: "#fff",
                    ease: power2
                },
                "<"
            );
            tl.to(
                spanBefore,
                0.7,
                {
                    background: "#fff",
                    ease: power2
                },
                "<"
            );

            tl.to(
                ".btn .btn-outline",
                0.7,
                {
                    x: -40,
                    y: 40,
                    width: "140px",
                    height: "140px",
                    border: "1px solid #e2e2dc",
                    ease: power4
                },
                "<"
            );
            tl.to(
                path,
                0.7,
                {
                    attr: {
                        d: start
                    },
                    ease: power2
                },
                "<"
            ).to(
                path,
                0.7,
                {
                    attr: { d: end },
                    ease: power2
                },
                "-=0.7"
            );

            tl.to(
                ".overlay",
                0.7,
                {
                    opacity: 1,
                    display: "flex",
                    ease: power2
                },
                "-=0.7"
            );

            tl.to(
                ".menu",
                0.7,
                {
                    visibility: "visible"
                },
                "-=0.7"
            );

            tl.to(
                ".menu-item>a",
                0.7,
                {
                    top: 0,
                    ease: "power3.out",
                    stagger: {
                        amount: 0.5
                    }
                },
                "-=0.7"
            ).reverse();

        }

    
    }, { once: true });
</script>
