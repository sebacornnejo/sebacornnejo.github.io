<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8" />
        <link href="/static/plot-font.css" rel="stylesheet">
        <style>
            body {
                font-family: 'Montserrat', sans-serif;
            }
        </style>
    <link rel="stylesheet" href="/static/mobile.css?v=a13d3c4996cf" media="(max-width: 767px)">
</head>
<body>
    <div>                        <script type="text/javascript">window.PlotlyConfig = {MathJaxConfig: 'local'};</script>
        <script src="/static/plotly/plotly-2.27.0-2bdf0ef1bca85b83.js"></script>
<script>
(() => {
  const frame = window.frameElement;
  const viewportWindow = frame ? window.parent : window;
  if (!viewportWindow.matchMedia("(max-width: 767px)").matches) return;

  const canvas = document.createElement("canvas").getContext("2d");
  canvas.font = "bold 15px Montserrat, sans-serif";
  const entityDecoder = document.createElement("textarea");

  function titleLines(title, width) {
    return title.split(/<br\s*\/?\s*>/i).flatMap((part) => {
      entityDecoder.innerHTML = part.replace(/<[^>]*>/g, "");
      const lines = [];
      let line = "";
      for (const word of entityDecoder.value.trim().split(/\s+/)) {
        const next = line ? line + " " + word : word;
        if (line && canvas.measureText(next).width > width) {
          lines.push(line);
          line = word;
        } else {
          line = next;
        }
      }
      if (line) lines.push(line);
      return lines.map((text) => text.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;"));
    });
  }

  const newPlot = Plotly.newPlot;
  Plotly.newPlot = function (target, data, layout, config) {
    Plotly.newPlot = newPlot;
    const plot = typeof target === "string" ? document.getElementById(target) : target;
    const view = document.createElement("div");
    view.className = "mobile-plot-view";
    plot.before(view);
    view.append(plot);

    const viewport = view.clientWidth;
    const starts = (axis) => new Set(Object.keys(layout)
      .filter((name) => new RegExp("^" + axis + "axis\\d*$").test(name))
      .map((name) => layout[name].domain?.[0] ?? 0)).size;
    const columns = Math.max(1, starts("x"));
    const rows = Math.max(1, starts("y"));
    const matrix = Math.max(0, ...data.map((trace) => trace.type === "splom" ? trace.dimensions.length : 0));
    const geographic = data.some((trace) => /^choropleth/.test(trace.type));
    const heatmap = data.some((trace) => trace.type === "heatmap");
    // Retain the subplot grid and readable axes on charts wider than a phone.
    const width = Math.max(viewport, columns * 198 + 64, matrix * 132 + 96, heatmap ? 510 : 0);
    const height = geographic ? 410 : Math.max(460, rows * 265 + 148, matrix * 132 + 110);
    plot.style.width = "100%";
    plot.style.minWidth = width + "px";
    plot.style.height = height + "px";
    if (width > viewport) {
      view.tabIndex = 0;
      view.setAttribute("role", "region");
      view.setAttribute("aria-label", "Scrollable chart");
      const controls = document.createElement("div");
      controls.className = "mobile-plot-controls";
      view.before(controls);
      for (const step of [-1, 1]) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = step < 0 ? "‹" : "›";
        button.setAttribute("aria-label", step < 0 ? "Chart left" : "Chart right");
        button.addEventListener("click", () => {
          const behavior = matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth";
          view.scrollBy({ left: step * Math.round(view.clientWidth * .8), behavior });
        });
        controls.append(button);
      }
    }
    const title = typeof layout.title === "string" ? { text: layout.title } : layout.title || {};
    const lines = titleLines(title.text || "", Math.min(viewport, 360) - 27);
    const mobileLayout = {
      ...layout,
      width: undefined,
      height,
      autosize: true,
      title: {
        ...title,
        text: lines.join("<br>"),
        font: { ...title.font, size: 15 },
        x: 12 / width, xref: "container", xanchor: "left",
        y: 1 - 27 / height, yref: "container", yanchor: "top",
      },
      margin: {
        ...layout.margin,
        l: geographic ? 12 : 48, r: 16, t: 39 + 19 * lines.length, b: geographic ? 68 : 72,
      },
    };
    if (columns === 1 && matrix === 0 && !heatmap) {
      mobileLayout.legend = {
        ...layout.legend, orientation: "h", x: 0, xanchor: "left", y: -.24, yanchor: "top",
        font: { ...layout.legend?.font, size: 10 },
      };
    }

    const colorbar = (original) => ({
      ...original, orientation: "h", x: .5, xanchor: "center", y: -.14, yanchor: "top",
      len: .88, lenmode: "fraction", thickness: 12, thicknessmode: "pixels",
      title: { ...original?.title, side: "bottom" },
    });
    if (geographic) {
      for (const name of Object.keys(layout).filter((key) => /^coloraxis\d*$/.test(key))) {
        mobileLayout[name] = { ...layout[name], colorbar: colorbar(layout[name].colorbar) };
      }
      data = data.map((trace) => /^choropleth/.test(trace.type)
        ? { ...trace, colorbar: colorbar(trace.colorbar) } : trace);
    }
    if (frame) mobileLayout.dragmode = false;
    return newPlot.call(this, target, data, mobileLayout, { ...config, responsive: true });
  };
})();
</script>                <div id="bcfdbe27-fdbf-40c1-a82e-667974260ee7" class="plotly-graph-div" style="height:1520px; width:1520px;"></div>            <script src="/static/plotly/chart-2bed165b62903791.js"></script>        </div>
</body>
</html>
